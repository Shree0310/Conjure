<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Builder - Local Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white">
  <div class="h-screen flex">
    <!-- Chat Panel (Local) -->
    <div class="w-1/2 border-r border-zinc-800 flex flex-col">
      <!-- Header -->
      <div class="px-6 py-4 border-b border-zinc-800 bg-zinc-900">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-2xl font-bold">AI UI Builder</h1>
            <p class="text-sm text-zinc-400 mt-1">Describe your UI and watch it build</p>
          </div>
          <div class="flex items-center gap-2">
            <div id="status-indicator" class="w-2 h-2 rounded-full bg-red-500"></div>
            <span id="status-text" class="text-xs text-zinc-500">Checking...</span>
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div id="messages" class="flex-1 overflow-y-auto px-6 py-4 space-y-4">
        <div class="h-full flex items-center justify-center text-zinc-500 text-center">
          <div>
            <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
            </svg>
            <p class="text-lg font-semibold mb-2">Start building</p>
            <p class="text-sm mb-4">Try these prompts:</p>
            <div class="space-y-2 text-sm text-left max-w-xs mx-auto">
              <div class="bg-zinc-900 p-3 rounded-lg border border-zinc-800">"Create a modern pricing card"</div>
              <div class="bg-zinc-900 p-3 rounded-lg border border-zinc-800">"Build a contact form"</div>
              <div class="bg-zinc-900 p-3 rounded-lg border border-zinc-800">"Make a hero section"</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Input -->
      <div class="px-6 py-4 border-t border-zinc-800 bg-zinc-900">
        <div class="mb-3">
          <label class="text-xs text-zinc-400 mb-1 block">Sandbox URL (from pnpm preview)</label>
          <input
            id="sandbox-url"
            type="text"
            placeholder="https://sb-xxxxx.vercel.run"
            class="w-full bg-zinc-800 text-white placeholder-zinc-500 rounded-lg px-4 py-2 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
          />
        </div>
        <div class="flex gap-2">
          <textarea
            id="prompt-input"
            placeholder="Describe the UI you want to build..."
            rows="1"
            class="flex-1 bg-zinc-800 text-white placeholder-zinc-500 rounded-xl px-4 py-3 border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"
          ></textarea>
          <button
            id="build-btn"
            class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 disabled:bg-zinc-800 disabled:text-zinc-600 text-white rounded-xl font-semibold transition-colors"
          >
            Build
          </button>
        </div>
        <p class="text-xs text-zinc-500 mt-2">
          Press Enter to build, Shift+Enter for new line
        </p>
      </div>
    </div>

    <!-- Preview Panel -->
    <div class="w-1/2 flex flex-col bg-zinc-900">
      <div class="px-6 py-4 border-b border-zinc-800">
        <h2 class="text-lg font-semibold">Sandbox Preview</h2>
        <p id="preview-status" class="text-sm text-zinc-400 mt-1">Enter sandbox URL to connect</p>
      </div>
      <div class="flex-1 relative bg-white">
        <iframe id="preview-frame" class="w-full h-full border-0"></iframe>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3001';
    const messages = [];

    const messagesEl = document.getElementById('messages');
    const promptInput = document.getElementById('prompt-input');
    const buildBtn = document.getElementById('build-btn');
    const sandboxUrlInput = document.getElementById('sandbox-url');
    const previewFrame = document.getElementById('preview-frame');
    const statusIndicator = document.getElementById('status-indicator');
    const statusText = document.getElementById('status-text');
    const previewStatus = document.getElementById('preview-status');

    // Load saved sandbox URL
    const savedUrl = localStorage.getItem('sandboxUrl');
    if (savedUrl) {
      sandboxUrlInput.value = savedUrl;
      updatePreview();
    }

    // Save sandbox URL on change
    sandboxUrlInput.addEventListener('input', () => {
      localStorage.setItem('sandboxUrl', sandboxUrlInput.value);
      updatePreview();
    });

    // Check API status
    async function checkAPIStatus() {
      try {
        const res = await fetch(`${API_URL}/api/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: 'test' })
        });
        statusIndicator.className = 'w-2 h-2 rounded-full bg-green-500';
        statusText.textContent = 'API Connected';
      } catch {
        statusIndicator.className = 'w-2 h-2 rounded-full bg-red-500';
        statusText.textContent = 'API Offline';
      }
    }

    checkAPIStatus();
    setInterval(checkAPIStatus, 10000);

    function updatePreview() {
      const url = sandboxUrlInput.value.trim();
      if (url) {
        previewFrame.src = url;
        previewStatus.textContent = 'Connected to sandbox';
      } else {
        previewFrame.src = '';
        previewStatus.textContent = 'Enter sandbox URL to connect';
      }
    }

    function addMessage(role, content) {
      messages.push({ role, content });
      renderMessages();
    }

    function renderMessages() {
      if (messages.length === 0) return;

      messagesEl.innerHTML = messages.map(msg => `
        <div class="flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}">
          <div class="max-w-[80%] rounded-2xl px-4 py-3 ${
            msg.role === 'user'
              ? 'bg-indigo-600 text-white'
              : 'bg-zinc-800 text-white border border-zinc-700'
          }">
            <div class="text-xs opacity-70 mb-1">${msg.role === 'user' ? 'You' : 'Claude'}</div>
            <div class="whitespace-pre-wrap break-words">${msg.content}</div>
          </div>
        </div>
      `).join('');

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function buildUI() {
      const prompt = promptInput.value.trim();
      const sandboxUrl = sandboxUrlInput.value.trim();

      if (!prompt) return;
      if (!sandboxUrl) {
        alert('Please enter your sandbox URL first (from pnpm preview)');
        return;
      }

      addMessage('user', prompt);
      promptInput.value = '';
      buildBtn.disabled = true;
      buildBtn.textContent = 'Building...';

      try {
        const res = await fetch(`${API_URL}/api/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        const data = await res.json();

        if (data.success) {
          // Send code to sandbox
          await fetch(`${sandboxUrl}/update`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: data.code })
          });

          addMessage('assistant', '✅ UI built successfully! Check the preview →');
        } else {
          throw new Error(data.error || 'Failed to generate UI');
        }
      } catch (error) {
        addMessage('assistant', `❌ Error: ${error.message}\n\nMake sure:\n1. API server is running (pnpm server)\n2. Sandbox is running (pnpm preview)\n3. You have a valid Anthropic API key`);
      } finally {
        buildBtn.disabled = false;
        buildBtn.textContent = 'Build';
      }
    }

    buildBtn.addEventListener('click', buildUI);

    promptInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        buildUI();
      }
    });
  </script>
</body>
</html>
